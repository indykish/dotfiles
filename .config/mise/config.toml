cfssl = "latest"
cmake = "3.31.12"
cosign = "3.1.3"
go = "latest"
grpcurl = "latest"
helm = "latest"
jsonnet-bundler = "latest"
jq = "latest"
k3d = "latest"
k6 = "latest"
kubectl = "latest"
mkcert = "latest"
maven = "latest"
mc = "latest"
python = "3.14"
ripgrep = "latest"
rust = "1.99.1"
shfmt = "latest"
shellcheck = "latest"
starship = "latest"
terraform = "latest"
trivy = "latest"
uv = "latest"
usage = "latest"
protobuf = "latest"
glab = { version = "latest", exe = "glab" }
tmux = "latest"
node = "26"
actionlint = "latest"
gitleaks = "latest"
1password-cli = "latest"
cloudflared = "latest"
yamllint = "latest"
postgres = "latest"
"npm:pnpm" = "latest"
"github:grafana/gcx" = "latest"
gh = "latest"
yq = "latest"
