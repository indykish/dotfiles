oha = "latest"
direnv = "latest"
"github:planetscale/cli" = "latest"
"cargo:cargo-mutants" = "latest"
sccache = "latest"
muse = { version = "latest", bin = "muse", checksum_expr = '"sha256:" + fromJSON(body).artifacts[(arch == "x64" ? "x86" : "aarch64") + "_" + os].checksum', checksum_url = "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={{ version }}&file=manifest.json", platforms = { windows-arm64 = { bin = "muse.exe", url = "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={{ version }}&file=muse-aarch64-windows.exe" }, windows-x64 = { bin = "muse.exe", url = "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={{ version }}&file=muse-x86-windows.exe" } }, url = 'https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={{ version }}&file=muse-{{ arch(x64="x86", arm64="aarch64") }}-{{ os() }}', version_json_path = ".version", version_list_url = "https://api.meta.ai/muse-code/channels/muse-stable" }
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }

[settings]
idiomatic_version_file_enable_tools = ["python", "rust"]

[settings.status]
show_tools = true

