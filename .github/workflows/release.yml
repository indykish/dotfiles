name: release

# A merge to master releases — no tag to remember, no second motion after the
# Pull Request. agentsfleet releases from a `v*` tag instead, because it ships
# cross-compiled binaries and a prod deployment that must be cut deliberately;
# this package is one npm artifact whose only gate is the same `make audit` the
# Pull Request already passed.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Every merge runs this, and most merges do not change the version. npm
# versions are immutable, so publishing must be idempotent: the run asks the
# registry whether this exact version exists and stops if it does. That is
# more reliable than diffing package.json against the previous commit, which a
# squash merge or a revert can defeat.
permissions:
  contents: write # create the tag and the GitHub release
  id-token: write # npm provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Read the version this commit carries
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Is it already published?
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${{ steps.version.outputs.value }} is already on the registry — nothing to release"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${{ steps.version.outputs.value }} is new — releasing"
          fi

      - name: Install orly dependencies
        if: steps.published.outputs.already == 'false'
        run: cd orly && bun install --frozen-lockfile --ignore-scripts

      # The same gate the Pull Request passed, re-run against the merge commit.
      # A merge can combine two independently-green branches into a red master,
      # and this is the last point before an immutable artifact leaves.
      - name: make audit
        if: steps.published.outputs.already == 'false'
        run: make audit

      # Proves the payload installs from a real tarball rather than from this
      # checkout. A file missing from the `files` allowlist passes every local
      # test and dies on a stranger's first command — it has happened once
      # already, when a trimmed payload dropped a fixture the rule ledger cites.
      - name: Install the packed tarball into a throwaway repository
        if: steps.published.outputs.already == 'false'
        run: |
          PKG=$(npm pack --silent)
          mkdir -p /tmp/release-probe && tar xzf "$PKG" -C /tmp/release-probe
          mkdir -p /tmp/release-probe/target && cd /tmp/release-probe/target
          git init -q . && git config user.email ci@example.com && git config user.name ci
          printf 'package main\n' > main.go
          bash /tmp/release-probe/package/bin/orly init
          test -f AGENTS.orly.md || { echo "✗ orly's rules did not land"; exit 1; }
          test -f AGENTS.md      || { echo "✗ the repository's own file did not land"; exit 1; }
          bash /tmp/release-probe/package/bin/orly doctor
          echo "✓ the packed tarball installs and doctors clean"

      # Same route as agentsfleet's @agentsfleet/cli job: the npm credential
      # lives in 1Password, and CI holds only a service-account token. One
      # secret to rotate instead of one per package, and the publish token is
      # never a GitHub secret anyone with repo access can read.
      - name: Load the npm token from 1Password
        if: steps.published.outputs.already == 'false'
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: op://${{ vars.VAULT_PROD }}/npm-publish-token/credential

      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Tag the release and record it on GitHub
        if: steps.published.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          git tag "$TAG"
          git push origin "$TAG"
          {
            printf 'Install into any repository:\n\n'
            printf '```bash\n'
            printf 'bunx @agentsfleet/orly init\n'
            printf '```\n\n'
            printf 'Published: https://www.npmjs.com/package/@agentsfleet/orly/v/%s\n' "${{ steps.version.outputs.value }}"
          } > /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md --verify-tag
