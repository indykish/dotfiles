name: Harness

on:
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install orly dependencies
        run: cd orly && bun install --frozen-lockfile --ignore-scripts
      - name: make audit
        run: make audit
